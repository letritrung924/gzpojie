<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="hg2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hg3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2d8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2d8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="#06080f"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- glows -->
  <circle cx="300" cy="200" r="240" fill="url(#hg2)"/>
  <circle cx="550" cy="400" r="220" fill="url(#hg3)"/>

  <!-- network nodes -->
  <g stroke-width="1" fill="none">
    <line x1="100" y1="100" x2="250" y2="180" stroke="rgba(0,240,255,0.18)"/>
    <line x1="250" y1="180" x2="400" y2="120" stroke="rgba(0,240,255,0.18)"/>
    <line x1="400" y1="120" x2="550" y2="200" stroke="rgba(139,92,246,0.2)"/>
    <line x1="550" y1="200" x2="680" y2="120" stroke="rgba(139,92,246,0.18)"/>
    <line x1="100" y1="300" x2="250" y2="180" stroke="rgba(0,240,255,0.18)"/>
    <line x1="250" y1="180" x2="300" y2="380" stroke="rgba(139,92,246,0.2)"/>
    <line x1="300" y1="380" x2="450" y2="320" stroke="rgba(255,45,138,0.18)"/>
    <line x1="450" y1="320" x2="550" y2="200" stroke="rgba(0,240,255,0.18)"/>
    <line x1="450" y1="320" x2="600" y2="450" stroke="rgba(255,45,138,0.18)"/>
    <line x1="600" y1="450" x2="700" y2="380" stroke="rgba(0,240,255,0.18)"/>
    <line x1="300" y1="380" x2="150" y2="500" stroke="rgba(139,92,246,0.18)"/>
    <line x1="300" y1="380" x2="600" y2="450" stroke="rgba(0,240,255,0.15)"/>
    <line x1="150" y1="500" x2="400" y2="520" stroke="rgba(255,45,138,0.16)"/>
    <line x1="400" y1="520" x2="600" y2="450" stroke="rgba(0,240,255,0.16)"/>
  </g>

  <g>
    <circle cx="100" cy="100" r="4" fill="#00f0ff" filter="drop-shadow(0 0 4px #00f0ff)"/>
    <circle cx="250" cy="180" r="6" fill="#00f0ff" filter="drop-shadow(0 0 8px #00f0ff)"/>
    <circle cx="400" cy="120" r="4" fill="#8b5cf6" filter="drop-shadow(0 0 4px #8b5cf6)"/>
    <circle cx="550" cy="200" r="7" fill="#00f0ff" filter="drop-shadow(0 0 10px #00f0ff)"/>
    <circle cx="680" cy="120" r="5" fill="#8b5cf6" filter="drop-shadow(0 0 6px #8b5cf6)"/>
    <circle cx="100" cy="300" r="5" fill="#ff2d8a" filter="drop-shadow(0 0 6px #ff2d8a)"/>
    <circle cx="300" cy="380" r="8" fill="#00f0ff" filter="drop-shadow(0 0 12px #00f0ff)"/>
    <circle cx="450" cy="320" r="5" fill="#8b5cf6" filter="drop-shadow(0 0 6px #8b5cf6)"/>
    <circle cx="600" cy="450" r="6" fill="#ff2d8a" filter="drop-shadow(0 0 8px #ff2d8a)"/>
    <circle cx="700" cy="380" r="4" fill="#00f0ff" filter="drop-shadow(0 0 4px #00f0ff)"/>
    <circle cx="150" cy="500" r="5" fill="#8b5cf6" filter="drop-shadow(0 0 6px #8b5cf6)"/>
    <circle cx="400" cy="520" r="6" fill="#00f0ff" filter="drop-shadow(0 0 8px #00f0ff)"/>
  </g>

  <!-- floating rectangles -->
  <g opacity="0.85">
    <rect x="430" y="40" width="180" height="36" rx="4" fill="#0a0f1d" stroke="rgba(0,240,255,0.3)"/>
    <text x="445" y="63" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">system.runtime</text>
    <circle cx="595" cy="58" r="4" fill="#00ff9d"/>

    <rect x="80" y="380" width="200" height="50" rx="4" fill="#0a0f1d" stroke="rgba(139,92,246,0.3)"/>
    <text x="95" y="402" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">module: privacy.engine</text>
    <text x="95" y="420" font-family="JetBrains Mono, monospace" font-size="10" fill="#8b5cf6">status: active</text>

    <rect x="500" y="160" width="220" height="48" rx="4" fill="#0a0f1d" stroke="rgba(255,45,138,0.3)"/>
    <text x="515" y="182" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">data.local_only = true</text>
    <text x="515" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff2d8a">encryption: aes-256</text>

    <rect x="50" y="180" width="180" height="40" rx="4" fill="#0a0f1d" stroke="rgba(0,240,255,0.3)"/>
    <text x="65" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">push 35 packages</text>
    <text x="65" y="216" font-family="JetBrains Mono, monospace" font-size="9" fill="#00f0ff">main → committed</text>
  </g>

  <!-- center pulse -->
  <g transform="translate(400 300)">
    <circle r="120" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" stroke-dasharray="2 6"/>
    <circle r="80" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1" stroke-dasharray="2 6"/>
    <circle r="40" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <circle r="6" fill="#00f0ff" filter="drop-shadow(0 0 12px #00f0ff)"/>
  </g>
</svg>
